[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "s2a"
version = "0.1.0"
description = "State-to-action adapters for fixed robot controllers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pyarrow>=14",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9", "build>=1.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
pythonpath = ["src"]
markers = [
  "integration: requires explicitly configured external data or simulator",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
